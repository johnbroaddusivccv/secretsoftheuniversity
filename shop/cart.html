<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart — Broaddus Scientific Group</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<header id="hdr"></header>
<main class="wrap">
  <div class="pagehead"><h1>Cart</h1></div>
  <div id="cart"></div>
</main>
<footer id="ftr"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function () {
  const S = window.SHOP, { esc, money, $ } = S;
  S.header(false); S.footer();
  function render() {
    const L = S.lines(), box = $('#cart');
    if (!L.length) { box.innerHTML = '<div class="box" style="max-width:520px;margin-bottom:70px"><p style="margin:0 0 16px">Your cart is empty.</p><a class="btn btn--solid" href="index.html">Browse the shop</a></div>'; return; }
    const sub = S.subtotal(), ship = S.shipping(sub, 'standard', 'US'), left = S.SITE.freeShip - sub;
    box.innerHTML = '<div class="layout"><div class="lines">' + L.map(l =>
      '<div class="line"><a class="card__img" href="product.html?id=' + encodeURIComponent(l.p.id) + '" tabindex="-1" aria-hidden="true">' + S.art(l.p, l.s) + '</a>' +
      '<div><div class="line__name"><a href="product.html?id=' + encodeURIComponent(l.p.id) + '">' + esc(l.p.name) + '</a></div>' +
      '<div class="line__meta">' + esc(l.z.label) + ' · ' + money(l.z.price) + ' each' + (l.p.status === 'backorder' ? ' · pre-order' : '') + '</div></div>' +
      '<div class="line__right"><div class="qty"><button type="button" data-q="' + esc(l.p.id) + '|' + l.s + '|' + (l.q - 1) + '" aria-label="Decrease quantity of ' + esc(l.p.name) + '">−</button><input type="number" min="0" max="99" value="' + l.q + '" data-set="' + esc(l.p.id) + '|' + l.s + '" aria-label="Quantity of ' + esc(l.p.name) + '"><button type="button" data-q="' + esc(l.p.id) + '|' + l.s + '|' + (l.q + 1) + '" aria-label="Increase quantity of ' + esc(l.p.name) + '">+</button></div>' +
      '<b>' + money(l.total) + '</b><button class="link" type="button" data-q="' + esc(l.p.id) + '|' + l.s + '|0">Remove</button></div></div>').join('') +
      '</div><aside class="box"><h2>Summary</h2>' +
      '<div class="row"><span>Subtotal</span><span>' + money(sub) + '</span></div>' +
      '<div class="row"><span>Standard US shipping</span><span>' + (ship ? money(ship) : 'Free') + '</span></div>' +
      '<div class="row row--total"><span>Estimated total</span><span>' + money(sub + ship) + '</span></div>' +
      (left > 0 ? '<p class="note">Add ' + money(left) + ' more for free US shipping.</p>' : '<p class="note">Your order ships free in the US.</p>') +
      '<a class="btn btn--solid" href="checkout.html" style="margin-top:16px">Checkout</a>' +
      '<a class="btn" href="index.html" style="margin-top:10px">Keep shopping</a></aside></div>';
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; const [id, s, q] = b.dataset.q.split('|'); S.setQty(id, +s, +q); render(); });
  document.addEventListener('change', e => { const i = e.target.closest('[data-set]'); if (!i) return; const [id, s] = i.dataset.set.split('|'); S.setQty(id, +s, Math.max(0, Math.min(99, +i.value | 0))); render(); });
  render();
})();
</script>
</body>
</html>
