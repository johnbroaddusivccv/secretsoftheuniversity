<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Broaddus Scientific Group</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<header id="hdr"></header>
<main class="wrap">
  <div class="pagehead"><h1>Checkout</h1><p>No payment is taken on this page. We confirm your order and email payment instructions with the lot COA.</p></div>
  <div id="body"></div>
</main>
<footer id="ftr"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function () {
  const S = window.SHOP, { esc, money, $ } = S;
  S.header(false); S.footer();
  const L = S.lines();
  if (!L.length) { $('#body').innerHTML = '<div class="box" style="max-width:520px;margin-bottom:70px"><p style="margin:0 0 16px">Your cart is empty.</p><a class="btn btn--solid" href="index.html">Browse the shop</a></div>'; return; }

  $('#body').innerHTML = '<form class="layout" id="co" novalidate>' +
    '<div class="form">' +
      '<div class="box form"><h2>Contact</h2>' +
        '<div class="two"><label><span>First name</span><input name="first" autocomplete="given-name" required></label><label><span>Last name</span><input name="last" autocomplete="family-name" required></label></div>' +
        '<div class="two"><label><span>Email</span><input name="email" type="email" autocomplete="email" required></label><label><span>Phone (optional)</span><input name="phone" type="tel" autocomplete="tel"></label></div>' +
      '</div>' +
      '<div class="box form"><h2>Shipping address</h2>' +
        '<label><span>Address</span><input name="addr1" autocomplete="address-line1" required></label>' +
        '<label><span>Apartment, suite (optional)</span><input name="addr2" autocomplete="address-line2"></label>' +
        '<div class="two"><label><span>City</span><input name="city" autocomplete="address-level2" required></label><label><span>State / region</span><input name="state" autocomplete="address-level1" required></label></div>' +
        '<div class="two"><label><span>ZIP / postal code</span><input name="zip" autocomplete="postal-code" required></label><label><span>Country</span><select name="country" autocomplete="country"><option value="US">United States</option><option value="INTL">Outside the US</option></select></label></div>' +
      '</div>' +
      '<div class="box form"><h2>Shipping method</h2>' +
        '<label class="radio"><input type="radio" name="method" value="standard" checked> Standard (3–5 business days)<b id="p-standard"></b></label>' +
        '<label class="radio"><input type="radio" name="method" value="express"> Express (2 business days)<b id="p-express"></b></label>' +
        '<p class="note" id="intl" hidden>We ship to select countries. International shipping is quoted by email before you pay; you are responsible for import rules where you live.</p>' +
      '</div>' +
      '<div class="box form"><h2>Notes</h2><label><span>Anything we should know (optional)</span><textarea name="notes" rows="3"></textarea></label>' +
        '<label class="check"><input type="checkbox" name="ruo" required> <span>I confirm I am 21 or older and am buying these products for laboratory research use only, not for human or animal consumption.</span></label>' +
        '<input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">' +
      '</div>' +
    '</div>' +
    '<aside class="box"><h2>Your order</h2>' +
      L.map(l => '<div class="row"><span>' + l.q + ' × ' + esc(l.p.name) + '<br><small style="color:var(--muted)">' + esc(l.z.label) + '</small></span><span>' + money(l.total) + '</span></div>').join('') +
      '<div class="row" style="border-top:1px solid var(--hair);margin-top:6px;padding-top:12px"><span>Subtotal</span><span>' + money(S.subtotal()) + '</span></div>' +
      '<div class="row"><span>Shipping</span><span id="shiprow"></span></div>' +
      '<div class="row row--total"><span>Total</span><span id="totalrow"></span></div>' +
      '<div class="msg" id="err" role="alert" hidden style="margin-top:14px"></div>' +
      '<button class="btn btn--solid" type="submit" id="place" style="width:100%;margin-top:16px">Place order</button>' +
      '<p class="note">You will get an email from us with payment instructions and your lot certificate of analysis. Nothing is charged now.</p>' +
    '</aside></form>';

  const f = $('#co'), sub = S.subtotal();
  function totals() {
    const country = f.country.value === 'US' ? 'US' : 'INTL', method = f.method.value;
    const ship = S.shipping(sub, method, country);
    $('#p-standard').textContent = country === 'US' ? (S.shipping(sub, 'standard', 'US') ? money(S.shipping(sub, 'standard', 'US')) : 'Free') : 'Quoted';
    $('#p-express').textContent = country === 'US' ? money(S.shipping(sub, 'express', 'US')) : 'Quoted';
    $('#intl').hidden = country === 'US';
    $('#shiprow').textContent = ship == null ? 'Quoted by email' : ship ? money(ship) : 'Free';
    $('#totalrow').textContent = ship == null ? money(sub) + ' + shipping' : money(sub + ship);
    return { ship, country, method };
  }
  f.addEventListener('change', totals); totals();
  f.addEventListener('input', e => e.target.classList.remove('bad'));
  f.addEventListener('change', e => e.target.classList.remove('bad'));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#err'); err.hidden = true;
    let bad = null;
    f.querySelectorAll('[required]').forEach(i => {
      const ok = i.type === 'checkbox' ? i.checked : i.type === 'email' ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.value.trim()) : !!i.value.trim();
      i.classList.toggle('bad', !ok); if (!ok && !bad) bad = i;
    });
    if (bad) { err.textContent = bad.name === 'ruo' ? 'Please confirm research use to continue.' : 'Please fill in the highlighted fields.'; err.hidden = false; bad.focus(); return; }
    const t = totals(), d = Object.fromEntries(new FormData(f));
    const order = {
      id: 'BSG-' + Date.now().toString(36).toUpperCase().slice(-5) + '-' + Math.floor(1000 + Math.random() * 9000),
      date: new Date().toISOString(),
      customer: { first: d.first.trim(), last: d.last.trim(), email: d.email.trim(), phone: (d.phone || '').trim() },
      ship: { addr1: d.addr1, addr2: d.addr2, city: d.city, state: d.state, zip: d.zip, country: t.country === 'US' ? 'United States' : 'Outside the US (see notes)', method: t.method },
      items: S.lines().map(l => ({ id: l.p.id, name: l.p.name, label: l.z.label, qty: l.q, price: l.z.price, total: l.total })),
      subtotal: sub, shipping: t.ship, total: t.ship == null ? sub : sub + t.ship,
      notes: d.notes || '', ruo: true, website: d.website || ''
    };
    const btn = $('#place'); btn.disabled = true; btn.textContent = 'Placing order…';
    let sent = false;
    try {
      const r = await fetch('/api/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) });
      sent = r.ok;
    } catch (x) { sent = false; }
    order.sent = sent;
    try { sessionStorage.setItem('bsg_last_order', JSON.stringify(order)); } catch (x) {}
    if (sent) S.setCart([]);          // if the email didn't go out, keep the cart so nothing is lost
    location.href = 'order.html?id=' + encodeURIComponent(order.id);
  });
})();
</script>
</body>
</html>
