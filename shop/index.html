<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broaddus Scientific Group — Research Compounds &amp; Peptides</title>
<meta name="description" content="Research nootropics, chemicals and peptides with lot certificates of analysis. For laboratory research use only.">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<script src="/assets/js/uninav.js"></script>
<header id="hdr"></header>
<main class="wrap">
  <nav class="chips" id="chips" aria-label="Categories"></nav>
  <div class="listhead"><h1 id="listtitle">Featured products</h1><span id="listcount"></span></div>
  <p class="catnote" id="catnote" hidden></p>
  <section class="grid" id="grid" aria-labelledby="listtitle"></section>
</main>
<footer id="ftr"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function () {
  const S = window.SHOP, { C, ITEMS, esc, qs, $ } = S;
  const q = (qs('q') || '').trim();
  // Peptides is the default department. Chemicals opens with ?tab=chemicals, or with any chemical
  // category (?cat=nootropics etc.), so older links keep landing on the right shelf.
  const isChemCat = C.chemCats.some(c => c[0] === qs('cat')) && !C.pepCats.some(c => c[0] === qs('cat'));
  const tab = qs('tab') === 'chemicals' || (qs('tab') !== 'peptides' && isChemCat) ? 'chem' : 'pep';
  const cats = tab === 'pep' ? C.pepCats : C.chemCats;
  const cat = cats.some(c => c[0] === qs('cat')) ? qs('cat') : cats[0][0];

  S.header(q ? null : tab);
  S.footer();
  S.gate();

  // Category chips (hidden for search results)
  const chips = $('#chips');
  if (q) chips.hidden = true;
  else chips.innerHTML = cats.map(c => '<a class="chip" href="index.html?' + (tab === 'pep' ? '' : 'tab=chemicals&') + 'cat=' + c[0] + '"' + (c[0] === cat ? ' aria-current="true"' : '') + '>' + esc(c[1]) + '</a>').join('');
  const on = chips.querySelector('[aria-current="true"]');
  if (on) chips.scrollLeft = Math.max(0, on.offsetLeft - chips.clientWidth / 2 + on.clientWidth / 2);

  // Which products
  const order = p => (p.status === 'out' ? 1 : 0);
  let list;
  if (q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    list = ITEMS.filter(p => { const hay = (p.title + ' ' + (p.aka || '') + ' ' + (p.summary || '') + ' ' + (p.cats || []).join(' ')).toLowerCase(); return words.every(w => hay.includes(w)); });
  } else if (tab === 'pep') {
    list = ITEMS.filter(p => p.type === 'pep' && (cat === 'all' || p.cat === cat));
  } else {
    const chem = ITEMS.filter(p => p.type === 'chem');
    list = cat === 'featured' ? chem.filter(p => p.featured) : cat === 'new' ? chem.filter(p => p.isNew) : chem.filter(p => p.cats.includes(cat));
  }
  list = list.slice().sort((a, b) => order(a) - order(b));

  const meta = cats.find(c => c[0] === cat);
  $('#listtitle').textContent = q ? 'Results for “' + q + '”' : meta[1];
  $('#listcount').textContent = list.length + (list.length === 1 ? ' product' : ' products');
  if (!q && meta[2]) { $('#catnote').textContent = meta[2]; $('#catnote').hidden = false; }
  document.title = (q ? 'Search: ' + q : meta[1]) + ' — Broaddus Scientific Group';

  $('#grid').innerHTML = list.length ? list.map(S.card).join('')
    : '<p class="empty">Nothing matches that search. Try a shorter name, or <a href="index.html">browse everything</a>.</p>';
})();
</script>
</body>
</html>
