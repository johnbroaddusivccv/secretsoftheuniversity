<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order received — Broaddus Scientific Group</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="main"></main>
<footer id="ftr"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function () {
  const S = window.SHOP, { esc, money, $ } = S;
  S.header(false); S.footer();
  let o = null;
  try { o = JSON.parse(sessionStorage.getItem('bsg_last_order')); } catch (e) {}
  const main = $('#main');
  if (!o || o.id !== S.qs('id')) {
    main.innerHTML = '<div class="pagehead"><h1>Order</h1><p>We can’t show this order here. If you placed one, check your email, or <a href="help.html#contact">contact us</a> with your order number.</p></div>';
    return;
  }
  const summary = [
    'Order ' + o.id, '',
    ...o.items.map(i => i.qty + ' x ' + i.name + ' (' + i.label + ') ' + money(i.total)),
    '', 'Subtotal: ' + money(o.subtotal),
    'Shipping (' + o.ship.method + '): ' + (o.shipping == null ? 'quote needed' : money(o.shipping)),
    '', o.customer.first + ' ' + o.customer.last + ' · ' + o.customer.email + (o.customer.phone ? ' · ' + o.customer.phone : ''),
    o.ship.addr1 + (o.ship.addr2 ? ', ' + o.ship.addr2 : ''), o.ship.city + ', ' + o.ship.state + ' ' + o.ship.zip, o.ship.country,
    o.notes ? '\nNotes: ' + o.notes : ''
  ].join('\n');
  const mailto = 'mailto:' + S.SITE.email + '?subject=' + encodeURIComponent('Order ' + o.id) + '&body=' + encodeURIComponent(summary);

  main.innerHTML = '<div class="pagehead"><h1>' + (o.sent ? 'Order received' : 'One more step') + '</h1>' +
    '<p>Order number <b>' + esc(o.id) + '</b></p></div>' +
    '<div class="layout"><div class="box">' +
      (o.sent
        ? '<p style="margin-top:0">Thank you, ' + esc(o.customer.first) + '. Your order is in. We’ll email <b>' + esc(o.customer.email) + '</b> with payment instructions and the lot certificate of analysis. Your items are held until then.</p>'
        : '<div class="msg" style="margin-bottom:16px">Your order didn’t reach us automatically. Tap the button below to email it to us. Your cart is still saved.</div>' +
          '<a class="btn btn--solid" href="' + mailto + '">Email this order to us</a>' +
          '<p class="note">Or write to <a href="mailto:' + S.SITE.email + '">' + S.SITE.email + '</a> with your order number.</p>') +
      '<h2 style="font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin:26px 0 8px">Ship to</h2>' +
      '<p style="margin:0">' + esc(o.customer.first + ' ' + o.customer.last) + '<br>' + esc(o.ship.addr1) + (o.ship.addr2 ? '<br>' + esc(o.ship.addr2) : '') + '<br>' + esc(o.ship.city + ', ' + o.ship.state + ' ' + o.ship.zip) + '<br>' + esc(o.ship.country) + '</p>' +
      '<a class="btn" href="index.html" style="margin-top:22px;max-width:260px">Back to the shop</a>' +
    '</div><aside class="box"><h2>Summary</h2>' +
      o.items.map(i => '<div class="row"><span>' + i.qty + ' × ' + esc(i.name) + '<br><small style="color:var(--muted)">' + esc(i.label) + '</small></span><span>' + money(i.total) + '</span></div>').join('') +
      '<div class="row" style="border-top:1px solid var(--hair);margin-top:6px;padding-top:12px"><span>Subtotal</span><span>' + money(o.subtotal) + '</span></div>' +
      '<div class="row"><span>Shipping</span><span>' + (o.shipping == null ? 'Quoted by email' : o.shipping ? money(o.shipping) : 'Free') + '</span></div>' +
      '<div class="row row--total"><span>Total</span><span>' + (o.shipping == null ? money(o.subtotal) + ' + shipping' : money(o.total)) + '</span></div>' +
    '</aside></div>';
})();
</script>
</body>
</html>
