<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmation — Broaddus Scientific Group</title>
<link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body data-page="">
<div id="chrome-top"></div>

<main class="container" id="order-mount" style="padding:40px 0"></main>

<div id="chrome-bottom"></div>
<script src="assets/js/data.js?v=5"></script>
<script src="assets/js/app.js?v=5"></script>
<script>
  const order = orderById(qs("id"));
  const mount = document.getElementById("order-mount");

  if(!order){
    mount.innerHTML = `<div class="center" style="padding:40px 0">
      <h1>Order not found</h1>
      <p class="muted">We couldn't find that order in this browser.</p>
      <a href="shop.html" class="btn">Back to shop</a></div>`;
  } else {
    const d = new Date(order.date);
    const dateStr = d.toLocaleDateString(undefined, {year:"numeric",month:"long",day:"numeric"});
    const s = order.shipDetails, c = order.customer;
    mount.innerHTML = `
      <div style="max-width:820px;margin:0 auto">
        <div style="border:1px solid var(--line);padding:32px;margin-bottom:24px">
          <div class="eyebrow" style="margin-bottom:10px">✓ Order received</div>
          <h1 style="margin-bottom:8px">Thank you, ${c.firstName}.</h1>
          <p class="muted" style="margin:0">Your order <b>${order.id}</b> was placed on ${dateStr}. A confirmation has been recorded — check your inbox at <b>${c.email}</b>.</p>
        </div>

        <div class="notice" style="margin-bottom:24px">
          <span class="ruo-flag">Next</span>
          <div><b>Completing payment.</b> Card checkout is being finalized, so no charge was made today. Our team will email you secure payment instructions and the batch Certificate of Analysis; your items are reserved until then.</div>
        </div>

        <div class="grid grid--2" style="margin-bottom:24px">
          <div>
            <div class="eyebrow" style="margin-bottom:10px">Shipping to</div>
            <p class="small" style="margin:0;line-height:1.7">
              ${c.firstName} ${c.lastName}<br>
              ${s.address}${s.address2 ? "<br>"+s.address2 : ""}<br>
              ${s.city}, ${s.state} ${s.zip}<br>
              ${s.country}${c.phone ? "<br>"+c.phone : ""}
            </p>
          </div>
          <div>
            <div class="eyebrow" style="margin-bottom:10px">Method</div>
            <p class="small" style="margin:0">${s.method==="express" ? "Express (2-day) cold-chain" : "Standard (3–5 business days)"}</p>
          </div>
        </div>

        <div class="eyebrow" style="margin-bottom:10px">Items</div>
        <div style="border:1px solid var(--line-soft);margin-bottom:20px">
          ${order.items.map(i=>`<div class="co-item" style="padding:14px 18px"><span>${i.name} <span class="muted">· ${i.size} × ${i.qty}</span></span><span class="mono">${money(i.price*i.qty)}</span></div>`).join("")}
        </div>

        <div class="summary" style="max-width:340px;margin-left:auto">
          <div class="row" style="display:flex;justify-content:space-between;padding:8px 0"><span>Subtotal</span><b>${money(order.subtotal)}</b></div>
          ${(order.discounts || (order.discount ? [order.discount] : [])).map(d=>`<div class="row" style="display:flex;justify-content:space-between;padding:8px 0"><span>${d.label || ("Discount ("+d.code+")")}</span><b>${d.amount ? "−"+money(d.amount) : "Free shipping"}</b></div>`).join("")}
          <div class="row" style="display:flex;justify-content:space-between;padding:8px 0"><span>Shipping</span><b>${order.shipping===0 ? "FREE" : money(order.shipping)}</b></div>
          <div class="row total" style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:800;font-size:1.15rem"><span>Total</span><b>${money(order.total)}</b></div>
        </div>

        <div style="text-align:center;margin-top:32px">
          <a href="shop.html" class="btn btn--solid">Continue shopping</a>
          <a href="about.html#contact" class="btn">Contact support</a>
        </div>
      </div>`;
  }
</script>
</body>
</html>
