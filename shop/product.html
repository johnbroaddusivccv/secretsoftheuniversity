<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Broaddus Scientific Group</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="main"></main>
<footer id="ftr"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/chemdata.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function () {
  const S = window.SHOP, { esc, money, $ } = S;
  const p = S.byId(S.qs('id'));
  S.header(p ? p.type : 'chem');
  S.footer();
  S.gate();
  const main = $('#main');
  if (!p) {
    main.innerHTML = '<div class="pagehead"><h1>Product not found</h1><p>It may have been renamed or removed. <a href="index.html">Back to the shop</a>.</p></div>';
    return;
  }
  document.title = p.title + ' — Broaddus Scientific Group';
  const dept = p.type === 'pep' ? '<a href="index.html?tab=peptides">Peptides</a>' : '<a href="index.html">Chemicals</a>';
  const firstCat = (p.cats || [])[0];
  const catLink = firstCat ? ' / <a href="index.html?' + (p.type === 'pep' ? 'tab=peptides&' : '') + 'cat=' + firstCat + '">' + esc(S.catName(p.type, firstCat)) + '</a>' : '';
  let s = 0, q = 1;

  const CD = (window.CHEMDATA && window.CHEMDATA[p.key]) || null;
  const facts = [];
  const add = (k, v) => { if (v) facts.push('<tr><th>' + k + '</th><td>' + esc(v) + '</td></tr>'); };
  if (p.type === 'chem') { add('Form', p.form); add(/solution|spray|gel/i.test(p.form) ? 'Concentration' : 'Amount', p.size); }
  else { add('Form', p.form); add('Sizes', p.sizes.map(z => z.label).join(', ')); }
  add('Also known as', p.aka);
  if (!CD) { add('CAS number', p.cas); add('Molecular formula', p.formula); add('Molecular weight', p.mw); }
  if (!CD || !CD.sequence3) add('Sequence', p.sequence);
  add('Half-life', p.halfLife);
  add('Purity', p.purity || 'Lot-specific; see the certificate of analysis');
  add('Storage', p.storage);
  if (!CD && (!p.cas || !p.formula)) facts.push('<tr><th>Identity data</th><td>Structure, CAS and formula for this lot are on its certificate of analysis.</td></tr>');
  add('Categories', (p.cats || []).map(c => S.catName(p.type, c)).join(', '));

  function chemPanel() {
    if (!CD) return '';
    if (!(CD.cas || CD.formula || CD.iupac || CD.pubchem_cid || CD.sequence3)) return '';
    const sub = f => esc(f).replace(/(\d+)/g, '<sub>$1</sub>').replace(/·<sub>(\d+)<\/sub>/g, '·$1');
    const rows = [];
    const row = (k, v, raw) => { if (v) rows.push('<tr><th>' + k + '</th><td>' + (raw ? v : esc(v)) + '</td></tr>'); };
    if (CD.sequence3) row('Sequence', '<code class="mono">' + esc(CD.sequence3) + '</code>', true);
    if (CD.sequence1) row('One-letter code', '<code class="mono">' + esc(CD.sequence1) + '</code>', true);
    if (CD.length) row('Length', CD.length + ' residues');
    row('Modifications', CD.modifications);
    if (p.type !== 'pep' || (CD.iupac && CD.iupac.length < 160)) row('IUPAC name', CD.iupac);
    row('CAS number', CD.cas);
    if (CD.pubchem_cid) row('PubChem CID', '<a href="https://pubchem.ncbi.nlm.nih.gov/compound/' + encodeURIComponent(CD.pubchem_cid.replace(/\D.*$/, '')) + '" target="_blank" rel="noopener">' + esc(CD.pubchem_cid) + '</a>', true);
    row('ChemSpider ID', CD.chemspider);
    row('UNII', CD.unii);
    if (CD.drugbank) row('DrugBank', '<a href="https://go.drugbank.com/drugs/' + encodeURIComponent(CD.drugbank) + '" target="_blank" rel="noopener">' + esc(CD.drugbank) + '</a>', true);
    if (CD.formula) row('Molecular formula', sub(CD.formula), true);
    row('Molecular weight', CD.mw);
    if (CD.smiles) row('SMILES', '<code class="mono" id="smiles">' + esc(CD.smiles) + '</code> <button type="button" class="link" id="copysmiles">Copy</button>', true);
    if (CD.inchikey) row('InChIKey', '<code class="mono">' + esc(CD.inchikey) + '</code>', true);
    // Products sold as a salt: the public record describes the parent compound, so its physical
    // properties (state, melting point, solubility) would mislead. Show identity only.
    const salt = /\b(HCl|HBr|3HCl|sulfate|oxalate|sodium|hexasodium|disodium|potassium|bromide|acetate|salt)\b/i.test(p.name);
    if (!salt) { row('Melting point', CD.melting_point); row('Solubility in water', CD.solubility_water); row('Appearance', CD.appearance); }
    const saltNote = salt;
    return '<div class="panel"><h2>Chemical data</h2><div class="' + (CD.structure ? 'cols2' : '') + '"><div><table class="facts"><tbody>' + rows.join('') + '</tbody></table>' +
      '<p class="note">' + (saltNote ? 'Identifiers and structure are for the parent compound; this product is supplied as listed in its name. ' : '') +
      'From public compound records' + (CD.source_url ? ' (<a href="' + esc(CD.source_url) + '" target="_blank" rel="noopener">source</a>)' : '') + (CD.verified ? '; the structure was checked against its published InChIKey' : CD.check === 'sequence-checked' ? '; the sequence was checked against the published molecular formula' : CD.check === 'record' ? '; shown as published, not independently checked' : '') + '. The lot certificate of analysis is the authority for the material you receive.</p></div>' +
      (CD.structure ? '<figure class="struct"><img src="assets/img/structures/' + encodeURIComponent(p.key) + '.svg" alt="2D chemical structure of ' + esc(p.name) + '" loading="lazy"><figcaption>2D structure</figcaption></figure>' : '<div></div>') +
      '</div></div>';
  }

  main.innerHTML =
    '<nav class="crumbs\" aria-label="Breadcrumb"><a href="index.html">Shop</a> / ' + dept + catLink + '</nav>' +
    '<div class="pdp">' +
      '<div class="pdp__img"><div class="card__img" id="pimg">' + (S.BADGE[p.status] ? '<span class="badge">' + S.BADGE[p.status] + '</span>' : '') + S.art(p, 0, true) + '</div></div>' +
      '<div>' +
        '<h1>' + esc(p.type === 'chem' ? p.name : p.name) + '</h1>' +
        '<p class="aka">' + esc(p.type === 'chem' ? p.form + ' · ' + p.size : (p.aka || p.form)) + '</p>' +
        '<p class="price" id="price">' + money(p.sizes[0].price) + '</p>' +
        '<div class="stock">' + (p.status === 'out' ? 'Out of stock' : p.status === 'backorder' ? 'Backorder · ships when restocked' : p.status === 'delay' ? 'In stock · ships in 1–3 days' : 'In stock') + '</div>' +
        '<p class="summary">' + esc(p.summary) + '</p>' +
        (p.sizes.length > 1 ? '<div class="field"><span>Size</span><div class="sizes" id="sizes">' + p.sizes.map((z, i) => '<button type="button" class="size" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(z.label) + ' · ' + money(z.price) + '</button>').join('') + '</div></div>' : '') +
        (p.status === 'out' ? '<button class="btn" type="button" disabled style="width:100%">Out of stock</button>' :
          '<div class="qtyrow"><div class="qty"><button type="button" id="minus" aria-label="Decrease quantity">−</button><input id="qty" type="number" min="1" max="99" value="1" aria-label="Quantity" inputmode="numeric"><button type="button" id="plus" aria-label="Increase quantity">+</button></div>' +
          '<button class="btn btn--solid" type="button" id="addbtn">' + (p.status === 'backorder' ? 'Pre order' : 'Add to cart') + '</button></div>') +
        '<p class="ruo">For laboratory research use only. Not for human or veterinary use. A lot certificate of analysis ships with every order; ask for the current lot’s COA any time through the <a href="help.html#testing">help center</a>.</p>' +
      '</div>' +
    '</div>' +
    '<div class="panel"><div class="cols2"><div>' +
      '<h2>Overview</h2><p>' + esc(p.overview || p.summary) + '</p>' +
      ((p.research || []).length ? '<h3>Areas of research</h3><ul>' + p.research.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '') +
    '</div><div><h2>Specifications</h2><table class="facts"><tbody>' + facts.join('') + '</tbody></table></div></div></div>' +
    chemPanel() +
    '<section class="related" id="related"></section>';

  // Related: same first category, in stock first
  const rel = S.ITEMS.filter(x => x.id !== p.id && x.type === p.type && (x.cats || []).includes(firstCat) && x.status !== 'out').slice(0, 4);
  if (rel.length) $('#related').innerHTML = '<h2>Related products</h2><div class="grid">' + rel.map(S.card).join('') + '</div>';

  const cp = $('#copysmiles');
  if (cp) cp.addEventListener('click', () => {
    const t = $('#smiles').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => S.toast('SMILES copied'), () => S.toast('Select the SMILES text to copy it'));
  });
  const sizes = $('#sizes');
  if (sizes) sizes.addEventListener('click', e => {
    const b = e.target.closest('.size'); if (!b) return;
    s = +b.dataset.i;
    sizes.querySelectorAll('.size').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#price').textContent = money(p.sizes[s].price);
    const img = $('#pimg'); const badge = img.querySelector('.badge');
    img.innerHTML = (badge ? badge.outerHTML : '') + S.art(p, s, true);
  });
  const qty = $('#qty');
  if (qty) {
    const setQ = v => { q = Math.max(1, Math.min(99, v | 0 || 1)); qty.value = q; };
    $('#minus').addEventListener('click', () => setQ(q - 1));
    $('#plus').addEventListener('click', () => setQ(q + 1));
    qty.addEventListener('change', () => setQ(+qty.value));
    $('#addbtn').addEventListener('click', () => S.addToCart(p.id, s, q));
  }
})();
</script>
</body>
</html>
