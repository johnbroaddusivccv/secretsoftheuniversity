<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Items — Broaddus Scientific Group</title>
<style>
/* ============================================================
   MERIDIAN PEPTIDES — Design System
   Monochrome, Inter, sharp corners, bordered uppercase controls.
   (Aesthetic modeled on clean research-chem storefronts.)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --black:#000;
  --ink:#111;
  --white:#fff;
  --paper:#fafafa;
  --tile:#f2f2f2;
  --studio:radial-gradient(125% 105% at 50% 30%, #fdfdfe 0%, #f2f3f5 55%, #e6e9ec 100%);
  --line:#000;
  --line-soft:#e4e4e4;
  --muted:#666;
  --muted-2:#8a8a8a;
  --accent:#000;      /* monochrome accent */
  --ok:#137a3f;
  --warn:#8a6d00;
  --maxw:1180px;
  --radius:0px;       /* sharp corners like the reference */
  --font:"Inter",-apple-system,system-ui,"Helvetica Neue",Helvetica,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--white);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.1;font-weight:800}
h1{font-size:clamp(2rem,4.5vw,3.4rem)}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
p{margin:0 0 1rem}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line-soft);margin:2.5rem 0}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-family:var(--font);font-weight:600;font-size:.9rem;letter-spacing:.04em;
  text-transform:uppercase;padding:15px 26px;border:1px solid var(--black);
  background:var(--white);color:var(--black);border-radius:var(--radius);
  cursor:pointer;transition:.15s ease;white-space:nowrap;
}
.btn:hover{background:var(--black);color:var(--white)}
.btn--solid{background:var(--black);color:var(--white)}
.btn--solid:hover{background:var(--white);color:var(--black)}
.btn--sm{padding:10px 16px;font-size:.78rem}
.btn--full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--black);color:var(--white)}

/* ---------- Top announcement + header ---------- */
.topbar{background:var(--black);color:var(--white);font-size:.76rem;letter-spacing:.06em;
  text-transform:uppercase;text-align:center;padding:9px 16px}
.header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:50}
.header__row{display:flex;align-items:center;gap:24px;padding:18px 24px;max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}
.brand__mark{border:2px solid var(--black);padding:6px 10px;font-size:1.05rem;text-transform:uppercase;line-height:1}
.brand__tag{font-size:.72rem;color:var(--muted);max-width:230px;line-height:1.3;letter-spacing:0;text-transform:none;font-weight:500}
.header__spacer{flex:1}
.header__links{display:flex;align-items:center;gap:22px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.header__links a:hover{opacity:.6}
.hsearch{margin:0}
.hsearch input{border:1px solid var(--black);background:var(--white);padding:9px 14px;font-family:var(--font);font-size:.82rem;width:210px;border-radius:var(--radius)}
.hsearch input::placeholder{color:var(--muted-2)}
.hsearch input:focus{outline:2px solid var(--black);outline-offset:-1px}
.cart-pill{border:1px solid var(--black);padding:6px 11px;display:inline-flex;gap:8px;align-items:center;
  background:var(--white);color:inherit;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.cart-pill:hover{background:var(--paper)}
.fav-pill{border:1px solid var(--black);padding:6px 10px;display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.9rem}
.fav-pill:hover{background:var(--paper)}
.fav-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border:1px solid var(--line-soft);
  background:rgba(255,255,255,.92);cursor:pointer;font-size:15px;line-height:1;color:#c2c2c2;
  display:flex;align-items:center;justify-content:center;z-index:2;transition:.15s}
.fav-btn:hover{border-color:#000;color:#000}
.fav-btn.on{color:#000;border-color:#000}
.cart-pill b{background:var(--black);color:var(--white);padding:0 7px;min-width:20px;text-align:center}

/* ---------- Primary nav ---------- */
.nav{border-bottom:1px solid var(--line)}
.nav__inner{display:flex;max-width:var(--maxw);margin:0 auto}
.nav__inner a{flex:1;text-align:center;padding:15px 10px;font-weight:700;font-size:.82rem;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:3px solid transparent}
.nav__inner a:hover{background:var(--paper)}
.nav__inner a.active{border-bottom-color:var(--black)}
.menu-toggle{display:none}

/* ---------- Hero ---------- */
.hero{padding:64px 0 48px;border-bottom:1px solid var(--line-soft)}
.hero__grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{margin-bottom:18px}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:46ch;margin-bottom:26px}
.hero__cta{display:flex;gap:12px;flex-wrap:wrap}
.hero__panel{border:1px solid var(--line);padding:28px}
.hero__panel h4{text-transform:uppercase;font-size:.78rem;letter-spacing:.08em;margin-bottom:16px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checklist li{display:flex;gap:12px;align-items:flex-start;font-size:.92rem}
.checklist li::before{content:"—";font-weight:800}

/* ---------- Section headers ---------- */
.section{padding:56px 0}
.section__head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.section__head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:10px}

/* ---------- Category filter pills ---------- */
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.pill{border:1px solid var(--black);background:var(--white);padding:10px 18px;font-size:.8rem;
  font-weight:600;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;border-radius:var(--radius)}
.pill:hover{background:var(--paper)}
.pill.active{background:var(--black);color:var(--white)}

/* ---------- Product grid + cards ---------- */
.grid{display:grid;gap:24px}
.grid--4{grid-template-columns:repeat(4,1fr)}
.grid--3{grid-template-columns:repeat(3,1fr)}
.grid--2{grid-template-columns:repeat(2,1fr)}
.card{border:1px solid var(--line-soft);display:flex;flex-direction:column;background:var(--white);
  transition:.15s ease}
.card:hover{border-color:var(--black)}
.card__media{background:var(--studio);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden}
.card__badge{position:absolute;top:12px;left:12px;background:var(--black);color:var(--white);
  font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;font-weight:700}
.vial{--vc:#111}
.card__body{padding:18px;display:flex;flex-direction:column;flex:1}
.card__cat{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);font-weight:700;margin-bottom:8px}
.card__title{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.card__desc{font-size:.85rem;color:var(--muted);flex:1;margin-bottom:14px}
.card__foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:800;font-size:1.05rem}
.price small{font-weight:500;color:var(--muted);font-size:.72rem}

/* ---------- Categories band ---------- */
.catband{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.catband a{padding:22px 20px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.catband a:hover{background:var(--black);color:var(--white)}
.catband a h4{font-size:1rem;margin-bottom:6px}
.catband a p{font-size:.78rem;color:var(--muted);margin:0}
.catband a:hover p{color:#ccc}

/* ---------- Feature strip ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{padding:26px 20px;border-right:1px solid var(--line-soft);text-align:center}
.strip div:last-child{border-right:0}
.strip b{display:block;text-transform:uppercase;font-size:.8rem;letter-spacing:.06em;margin-bottom:6px}
.strip span{font-size:.8rem;color:var(--muted)}

/* ---------- Product detail ---------- */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:48px 0}
.pdp__media{background:var(--studio);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:sticky;top:120px}
.pdp h1{margin-bottom:6px}
.pdp__aka{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;font-weight:600;margin-bottom:20px}
.pdp__price{font-size:1.6rem;font-weight:800;margin:16px 0}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.size-opt{border:1px solid var(--black);padding:12px 16px;cursor:pointer;font-weight:600;font-size:.85rem;min-width:70px;text-align:center}
.size-opt.active{background:var(--black);color:var(--white)}
.qty{display:inline-flex;border:1px solid var(--black);align-items:stretch;margin-right:12px}
.qty button{border:0;background:var(--white);width:40px;font-size:1.1rem;cursor:pointer}
.qty button:hover{background:var(--black);color:var(--white)}
.qty input{width:48px;border:0;text-align:center;font-family:var(--font);font-weight:700;font-size:1rem;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.spec{width:100%;border-collapse:collapse;margin-top:14px;font-size:.88rem}
.spec th,.spec td{text-align:left;padding:11px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.spec th{width:38%;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:36px 0 20px}
.tabs button{border:0;background:none;padding:14px 20px;font-weight:700;text-transform:uppercase;font-size:.78rem;letter-spacing:.04em;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.active{border-bottom-color:var(--black)}

/* ---------- Glossary ---------- */
.glossary-search{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.glossary-search input{flex:1;min-width:220px;border:1px solid var(--black);padding:14px 16px;font-family:var(--font);font-size:.95rem}
.gloss-item{border:1px solid var(--line-soft);padding:22px;margin-bottom:-1px}
.gloss-item:hover{border-color:var(--black);position:relative;z-index:1}
.gloss-item h3{font-size:1.25rem;margin-bottom:4px}
.gloss-item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{border:1px solid var(--line-soft);padding:3px 9px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* ---------- Calculator ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.calc-field{margin-bottom:18px}
.calc-field label{display:block;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.calc-field input,.calc-field select{width:100%;border:1px solid var(--black);padding:13px 14px;font-family:var(--font);font-size:1rem}
.calc-out{border:1px solid var(--line);padding:28px}
.calc-out .big{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.calc-out .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:.92rem}
.calc-out .row:last-child{border-bottom:0}

/* ---------- Cart ---------- */
.cart-row{display:grid;grid-template-columns:80px 1fr auto auto auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.cart-row .thumb{width:80px;height:80px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.summary{border:1px solid var(--line);padding:26px}
.summary .row{display:flex;justify-content:space-between;padding:10px 0;font-size:.95rem}
.summary .row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-weight:800;font-size:1.15rem}

/* ---------- Notice / disclaimer ---------- */
.notice{border:1px solid var(--black);padding:16px 20px;font-size:.82rem;display:flex;gap:12px;align-items:flex-start}
.notice b{text-transform:uppercase;letter-spacing:.04em}
.ruo-flag{background:#111;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;display:inline-block}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
  background:var(--black);color:var(--white);padding:14px 22px;font-size:.85rem;font-weight:600;
  letter-spacing:.03em;z-index:200;transition:.3s ease;text-transform:uppercase}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Cart drawer (mini-cart) ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .25s;z-index:150}
.drawer-overlay.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:390px;max-width:92vw;background:#fff;border-left:1px solid #000;
  transform:translateX(100%);transition:transform .28s ease;z-index:160;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer__head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #000}
.drawer__head b{text-transform:uppercase;letter-spacing:.06em;font-size:.9rem}
.drawer__close{border:0;background:none;font-size:1.7rem;cursor:pointer;line-height:1;padding:0 4px}
.drawer__body{flex:1;overflow-y:auto;padding:6px 20px}
.drawer__foot{border-top:1px solid #000;padding:18px 20px}
.drawer-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.drawer-item .thumb{width:56px;height:56px;background:var(--studio);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.qty--sm button{width:26px;font-size:.95rem}
.qty--sm input{width:32px;font-size:.82rem}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;color:var(--muted);font-family:var(--font);font-size:.78rem}
.linkbtn:hover{color:#000}

/* ---------- Checkout ---------- */
.checkout{display:grid;grid-template-columns:1.35fr .85fr;gap:40px;align-items:start}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-soft);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:#000}
.opt input{margin-top:3px}
.opt .opt__t{font-weight:700}
.opt .opt__d{font-size:.82rem;color:var(--muted)}
.opt .opt__p{margin-left:auto;font-weight:700}
.err{border-color:#b00020 !important}
.form-note{font-size:.82rem;color:var(--muted)}
.co-item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.9rem;border-bottom:1px solid var(--line-soft)}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--line);margin-top:40px;padding:48px 0 30px;background:var(--paper)}
.footer__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.footer h5{text-transform:uppercase;font-size:.75rem;letter-spacing:.08em;margin-bottom:14px}
.footer a{display:block;color:var(--muted);font-size:.86rem;padding:4px 0}
.footer a:hover{color:var(--black)}
.footer__bottom{border-top:1px solid var(--line-soft);margin-top:32px;padding-top:20px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* ---------- Age gate modal ---------- */
.gate{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.gate__box{border:1px solid var(--black);max-width:460px;padding:38px;text-align:center;background:#fff}
.gate__box h3{margin-bottom:12px}
.gate__box p{color:var(--muted);font-size:.9rem}
.gate__box .btn{margin-top:10px}

/* ---------- Page hero (inner pages) ---------- */
.page-hero{border-bottom:1px solid var(--line);padding:44px 0}
.page-hero .eyebrow{margin-bottom:12px}

/* ---------- Responsive ---------- */
@media(max-width:960px){
  .grid--4{grid-template-columns:repeat(2,1fr)}
  .grid--3{grid-template-columns:repeat(2,1fr)}
  .hero__grid{grid-template-columns:1fr;gap:32px}
  .pdp{grid-template-columns:1fr;gap:28px}
  .pdp__media{position:static}
  .calc{grid-template-columns:1fr}
  .catband{grid-template-columns:repeat(2,1fr)}
  .strip{grid-template-columns:repeat(2,1fr)}
  .footer__grid{grid-template-columns:1fr 1fr}
  .brand__tag{display:none}
}
@media(max-width:600px){
  .grid--4,.grid--3,.grid--2{grid-template-columns:1fr}
  .header__links a span{display:none}
  .hsearch{display:none}
  .nav__inner{flex-wrap:wrap}
  .nav__inner a{flex:1 1 33%}
  .cart-row{grid-template-columns:60px 1fr auto;grid-auto-rows:auto}
  .footer__grid{grid-template-columns:1fr}
  .section{padding:40px 0}
  .checkout{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
}

</style>
</head>

/* ============================================================
   MERIDIAN PEPTIDES — Glossary + Product Data
   ------------------------------------------------------------
   This single dataset powers the entire site:
     • The Glossary (educational encyclopedia)
     • The Shop (purchasable product grid)
     • Product detail pages
   To add a product, add an entry here. That's it.
   ============================================================ */

/* Research categories (structure modeled on common RUO catalogs) */
const CATEGORIES = [

  { id: "growth",       name: "Growth Hormone Research", blurb: "Secretagogues and releasing peptides studied for GH/IGF-1 axis modulation." },

  { id: "immune",       name: "Immune Research",         blurb: "Immunomodulatory peptides studied in immune-signaling pathways." },
  { id: "endocrine",    name: "Endocrine Research",      blurb: "Peptides studied in reproductive, hormonal, and neuroendocrine signaling." },
  { id: "performance",  name: "Performance Research",    blurb: "Peptides investigated in endurance, mitochondrial, and physical-performance models." },
  { id: "copper",       name: "Copper Peptides",         blurb: "Copper-complex peptides studied in skin, collagen, and regenerative research." },
  { id: "cosmetic",     name: "Skin & Cosmetic Peptides", blurb: "Peptides studied in dermal, collagen, and cosmetic-science research." },
  { id: "longevity",    name: "Longevity Research",      blurb: "Peptides studied in cellular aging, telomere, and senescence models." },
  { id: "blends",       name: "Peptide Blends",          blurb: "Pre-combined research blends for multi-pathway study designs." },
  { id: "supplies",     name: "Supplies",                blurb: "Reconstitution solutions, bacteriostatic water, and lab consumables." }
];

/* ---------------------------------------------------------------
   PRODUCTS / GLOSSARY ENTRIES
   Fields:
     id, name, aka, category, tags[], sizes[{label, price, sku}],
     summary (short, for cards), overview (long, glossary),
     research (bullet research-area strings),
     cas, sequence, molFormula, molWeight, halfLife, storage,
     purity, featured
   All content is written for Research Use Only context.
--------------------------------------------------------------- */
const PRODUCTS = [
  {
    id: "bpc-157", name: "BPC-157", aka: "Body Protection Compound-157",
    category: "recovery", tags: ["healing", "gut", "angiogenesis"], featured: true,

/* ---------- CART (localStorage) ---------- */
const CART_KEY = "broaddus_cart_v1";
function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }catch(e){ return []; } }
function saveCart(c){ localStorage.setItem(CART_KEY, JSON.stringify(c)); updateCartCount(); }
function cartCount(){ return getCart().reduce((n,i)=>n+i.qty,0); }
function cartSubtotal(){ return getCart().reduce((s,i)=>s + i.price*i.qty, 0); }
function updateCartCount(){ $(".js-cart-count").forEach(el => el.textContent = cartCount()); }

function addToCart(productId, sizeIndex=0, qty=1, silent=false){
  const p = productById(productId); if(!p) return;
  const size = p.sizes[sizeIndex] || p.sizes[0];
  const key = productId + "::" + size.sku;
  const cart = getCart();
  const existing = cart.find(i => i.key === key);
  if(existing){ existing.qty += qty; }
  else{ cart.push({ key, id:productId, name:p.name, size:size.label, sku:size.sku, price:size.price, qty }); }
  saveCart(cart);
  if(!silent){ if($("#cart-drawer")) openCart(); else toast(`Added — ${p.name} (${size.label})`); }
}

/* ---------- Stacks & protocols ---------- */
const stackById = id => (window.STACKS || []).find(s => s.id === id);
const protocolById = id => (window.PROTOCOLS || []).find(r => r.id === id);
const stacksWith = id => (window.STACKS || []).filter(s => s.components.some(c => c.id === id));
function stackPrice(s){
  return s.components.reduce((sum,c)=>{
    const p = productById(c.id); if(!p) return sum;
    const size = p.sizes[c.sizeIndex||0] || p.sizes[0];
    return sum + size.price;
  }, 0);
}
function addStackToCart(stackId){
  const s = stackById(stackId); if(!s) return;
  let n = 0;
  s.components.forEach(c => { if(productById(c.id)){ addToCart(c.id, c.sizeIndex||0, 1, true); n++; } });
  updateCartCount();
  toast(`Added stack — ${s.name} (${n} items)`);
  if($("#cart-drawer")) openCart();
}

/* ---------- Orders (localStorage; payment wired later) ---------- */
const ORDERS_KEY = "broaddus_orders_v1";
function getOrders(){ try{ return JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; }catch(e){ return []; } }
function saveOrders(o){ localStorage.setItem(ORDERS_KEY, JSON.stringify(o)); }
const orderById = id => getOrders().find(o => o.id === id);
function shippingCost(sub, method){
  if(sub === 0) return 0;
  if(sub >= SITE.freeShipThreshold) return method === "express" ? 15 : 0;
  return method === "express" ? 25 : 12;
}
function createOrder(customer, shipDetails, discount){
  const items = getCart();
  const sub = cartSubtotal();
  let ship = shippingCost(sub, shipDetails.method);
  if(discount && discount.freeShip) ship = 0;
  const disc = (discount && discount.amount) ? discount.amount : 0;
  const total = Math.max(0, +(sub - disc).toFixed(2)) + ship;
  const id = "BSG-" + Date.now().toString(36).toUpperCase().slice(-5) + "-" + Math.floor(1000 + Math.random()*9000);
  const order = { id, date: new Date().toISOString(), items, subtotal: sub, discount: discount || null, shipping: ship, total, customer, shipDetails, status: "awaiting-payment" };
  const orders = getOrders(); orders.push(order); saveOrders(orders);
  return order;
}

/* ---------- Discount codes ---------- */
const DISCOUNTS = {
  RESEARCH10: { type:"pct",  value:10, label:"10% off" },
  WELCOME15:  { type:"pct",  value:15, label:"15% off — welcome" },
  LAB20:      { type:"pct",  value:20, min:200, label:"20% off orders $200+" },
  FREESHIP:   { type:"ship", label:"Free shipping" }
};
function applyDiscount(code, sub){
  const key = (code||"").trim().toUpperCase();
  const c = DISCOUNTS[key];
  if(!c) return { error:"Invalid code" };
  if(c.min && sub < c.min) return { error:`Requires a ${c.min}+ subtotal` };
  if(c.type === "pct")  return { code:key, amount:+(sub * c.value/100).toFixed(2), freeShip:false, label:c.label };
  if(c.type === "ship") return { code:key, amount:0, freeShip:true, label:c.label };
  return { error:"Invalid code" };
}

function renderDrawer(){
  const body = $("#drawer-items"), foot = $("#drawer-foot");
  if(!body || !foot) return;
  const cart = getCart();
  if(!cart.length){
    body.innerHTML = `<p class="muted" style="padding:40px 0;text-align:center">Your cart is empty.</p>`;
    foot.innerHTML = `<a href="shop.html" class="btn btn--full" onclick="closeCart()">Browse peptides</a>`;
    return;
  }
  body.innerHTML = cart.map(i=>`
    <div class="drawer-item" data-key="${i.key}">
      <div class="thumb">${productGraphic(productById(i.id) || {name:i.name})}</div>
      <div>
        <a href="product.html?id=${i.id}"><b class="small">${i.name}</b></a>
        <div class="small muted">${i.size} · ${money(i.price)}</div>
        <div class="qty qty--sm" style="margin-top:8px">
          <button data-act="minus" aria-label="decrease">−</button>
          <input data-act="qty" type="number" value="${i.qty}" min="1" inputmode="numeric">
          <button data-act="plus" aria-label="increase">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div class="price small mono">${money(i.price*i.qty)}</div>
        <button class="linkbtn" data-act="remove" style="margin-top:8px">Remove</button>
      </div>
    </div>`).join("");
  const sub = cartSubtotal();
  const hint = sub < SITE.freeShipThreshold
    ? `<p class="small muted" style="margin:0 0 12px">Add ${money(SITE.freeShipThreshold - sub)} for free shipping</p>`
    : `<p class="small" style="margin:0 0 12px"><b>✓ Free shipping unlocked</b></p>`;
  foot.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;margin-bottom:10px"><span>Subtotal</span><span>${money(sub)}</span></div>
    ${hint}
    <a href="checkout.html" class="btn btn--solid btn--full" style="margin-bottom:8px">Checkout</a>
    <a href="cart.html" class="btn btn--full">View full cart</a>`;
  $("#drawer-items .drawer-item").forEach(row=>{
    const key = row.dataset.key;
    row.querySelector('[data-act="minus"]').onclick = ()=>{ const it=getCart().find(x=>x.key===key); setQty(key, it.qty-1); renderDrawer(); };
    row.querySelector('[data-act="plus"]').onclick  = ()=>{ const it=getCart().find(x=>x.key===key); setQty(key, it.qty+1); renderDrawer(); };
    row.querySelector('[data-act="qty"]').onchange  = (e)=>{ setQty(key, parseInt(e.target.value)||1); renderDrawer(); };
    row.querySelector('[data-act="remove"]').onclick = ()=>{ removeItem(key); renderDrawer(); };
  });
}
function openCart(){ const d=$("#cart-drawer"), o=$("#drawer-ov"); if(!d) return; renderDrawer(); d.classList.add("open"); d.setAttribute("aria-hidden","false"); if(o) o.classList.add("show"); }
function closeCart(){ const d=$("#cart-drawer"), o=$("#drawer-ov"); if(!d) return; d.classList.remove("open"); d.setAttribute("aria-hidden","true"); if(o) o.classList.remove("show"); }
window.openCart = openCart; window.closeCart = closeCart;
function setQty(key, qty){
  const cart = getCart();
  const item = cart.find(i=>i.key===key);
  if(!item) return;
  item.qty = Math.max(1, qty);
  saveCart(cart);
}
function removeItem(key){ saveCart(getCart().filter(i=>i.key!==key)); }
function clearCart(){ saveCart([]); }

/* ---------- Toast ---------- */

  let t = $(".toast");
  if(!t){ t = document.createElement("div"); t.className="toast"; document.body.appendChild(t); }

  clearTimeout(toastTimer);

}

}

<script>
  function render(){
    const favs = getFavs().map(id=>productById(id)).filter(Boolean);
    document.getElementById("fav-grid").innerHTML = favs.map(cardHTML).join("");
    document.getElementById("fav-empty").style.display = favs.length ? "none" : "block";
    document.getElementById("fav-actions").style.display = favs.length ? "block" : "none";
    document.getElementById("fav-count-txt").textContent = `${favs.length} saved`;
  }
  document.getElementById("clear-favs").onclick = ()=>{ saveFavs([]); render(); };
  // removing a favorite via a card heart should drop it from this page
  document.getElementById("fav-grid").addEventListener("click", e=>{ if(e.target.closest(".fav-btn")) setTimeout(render, 20); });
  render();
</script>
